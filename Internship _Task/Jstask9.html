<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
   <h1>Task 9</h1>
   <h2>Calculate the average of the numbers in an array of numbers</h2>
   <p id="demo"></p>
   <script>
   let number=[3,7,9,6,8,5,3,4];
   let sum=0;
   for(i=0;i<number.length;i++)
   {
    sum+= number[i];
   }
   let avg= sum/number.length ;
  console.log(avg);
  document.getElementById("demo").innerHTML=`The average of the numbers in an array is = ${avg}`;
   </script> 
</body>
</html>
