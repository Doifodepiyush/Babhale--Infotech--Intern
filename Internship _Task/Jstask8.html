<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Task 8</h1>
    <p id="arr"></p>
    <script>
     let array =[7,8,45,89,56,34,28,65];
     let sum=0;
     for(i=0;i<array.length;i++)
     {
        sum+=array[i];
     }
    console.log(sum);
    document.getElementById("arr").innerHTML=`The sum of the number in array is = ${sum}`;
    </script>
</body>
</html>
