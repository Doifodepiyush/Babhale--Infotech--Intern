<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>task 5</h1>
    <p id="sum">Calculate the sum of number from 1 to 10</p>
    <script>
    let sum=0;
   
    for(let i=0; i<=10;i++)
    {
      sum+= i;
      
    }
    console.log(`The sum of number is ${sum}`);
    document.getElementById("sum").innerHTML=`The sum of number is ${sum}`;
    </script>
</body>
</html>
