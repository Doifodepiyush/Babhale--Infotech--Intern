<body>
<h1>Caculate 10 !</h1>
<p id="mul">Find the factorial of 10</p>
    <script>
let factorial = 1;
for(let i=1; i<=10;i++)
{
  factorial*=i;

}
 console.log(factorial);
 document.getElementById("mul").innerHTML=`Factorial of 10 is  ${factorial}`;


    </script>
</body>
