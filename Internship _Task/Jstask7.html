<body>
    <h1>Task 7</h1>
    <h2>Calulate the sum of odd number grater than 10 and less than 30.</h2>
    <p id="demo"></p>
    <script>
    let num=0;
    for(let i=11;i<30;i++)
    {
       if(i%2!==0){
        num+=i;
       }
    }
    console.log(num);
   document.getElementById("demo").innerHTML= ` The Sum of odd numbers greater than 10 and less than 30 is = ${num}`;
    </script>
</body>
