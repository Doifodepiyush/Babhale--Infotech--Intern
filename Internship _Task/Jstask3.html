<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Print the multipiction table with 7</h1>
    <p id="multi"></p>
    <script>
     let number=7;
     let text=" ";
     for(i=1;i<=10;i++)
     {
        text+=`${number}x${i}=${number*i}`+"<br>";
        console.log(`${number}x${i}=${number*i}`);
     } 
    document.getElementById("multi").innerHTML=text;

    </script>
</body>
</html>
