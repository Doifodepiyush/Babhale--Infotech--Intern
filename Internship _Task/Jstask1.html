<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java script</title>
</head>
<body>
    <h1>Print the number from 1 to 10 </h1>
    <p id="num"></p>
    <script>
let text =" ";
for(let i=1; i<=10;i++)
{
    text+=i+"<br>";
    console.log(i);
}
document.getElementById("num").innerHTML=text;


    </script>
</body>
</html>
