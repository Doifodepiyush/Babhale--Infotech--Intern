<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Print the odd number less than 100</h2>
    <p id="demo"></p>
    <script>
     let text=" ";
     for(i=0;i<100;i++)
     {
        if(i%2!==0){
            document.getElementById("demo").innerHTML= text+=i+"<br>";
            console.log(i);
        }
     }
    </script>
</body>
</html>
